<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA Prediction 2026–27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: sticky scoreboard header with six numbered steps; each page opens with a how-to strip; drag-and-drop everywhere with tap as the fallback. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#E2E7EE; --ink:#121826; --muted:#5A6476; --line:#CFD6E0;
  --accent:#DD5A22; --accent-ink:#FFFFFF; --win:#1D8A6B; --lose:#CF4E35; --gold:#B07D0A;
  --shadow:0 1px 2px rgba(18,24,38,.05),0 8px 24px rgba(18,24,38,.06);
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111B; --surface:#141B29; --surface-2:#1C2537; --ink:#E8ECF3; --muted:#93A0B5; --line:#283247;
  --accent:#F27A3E; --accent-ink:#141B29; --win:#3CC29A; --lose:#F07A62; --gold:#E9B949;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111B; --surface:#141B29; --surface-2:#1C2537; --ink:#E8ECF3; --muted:#93A0B5; --line:#283247;
  --accent:#F27A3E; --accent-ink:#141B29; --win:#3CC29A; --lose:#F07A62; --gold:#E9B949;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.mob-only{display:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px 16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand small{font-family:var(--num);color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none;order:3}
nav.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:8px;font-weight:600;white-space:nowrap;color:var(--muted);display:flex;gap:7px;align-items:center}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button .n{font-family:var(--num);font-size:11px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-weight:700}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.undo{order:2;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.undo:not(:disabled):hover{border-color:var(--ink)}

main{padding-block:20px 56px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:12px}
.view-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;text-wrap:balance}
.view-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--lose);color:var(--lose)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.label{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:12px;font-family:var(--num);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* how-to strip */
.how{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));margin-bottom:16px;font-weight:600;font-size:14px}
.how-i{display:flex;gap:8px;align-items:center}
.touch-hint{display:none;color:var(--muted);font-weight:500}
@media (pointer:coarse){.touch-hint{display:inline}}
.how-i .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:0 0 26px}
.status{min-height:22px;font-weight:600;margin:-6px 0 12px;color:var(--muted)}
.status.on{color:var(--accent)}

/* drag and drop */
[data-drag]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
body.dragging,body.dragging *{cursor:grabbing!important}
.ghost{position:fixed!important;left:0;top:0;z-index:100;pointer-events:none;margin:0!important;box-shadow:0 12px 32px rgba(0,0,0,.28);opacity:.96;rotate:-2deg}
.lifted{opacity:.3}
.can{outline:2px dashed var(--accent);outline-offset:2px}
.over{outline:3px solid var(--accent)!important;outline-offset:2px;background:color-mix(in srgb,var(--accent) 14%,var(--surface))!important}
.grip{color:var(--muted);display:inline-flex;flex:0 0 auto;opacity:.8}

/* badges */
.badge{--s:40px;width:var(--s);height:var(--s);flex:0 0 var(--s);border-radius:50%;display:inline-grid;place-items:center;background:var(--c1);color:var(--ci);
  box-shadow:inset 0 0 0 calc(var(--s)*.07) var(--c2),0 0 0 1px var(--line);font-family:var(--display);font-weight:900;font-size:calc(var(--s)*.34);letter-spacing:.02em;line-height:1}
.badge.xs{--s:22px;font-size:9px}
.badge.sm{--s:28px}
.badge.lg{--s:60px}
.badge.xl{--s:96px}
.badge.blank{--c1:var(--surface-2);--c2:var(--line);--ci:var(--muted)}
.pdisc{width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:grid;place-items:center;background:var(--c1);color:var(--ci);font-family:var(--num);font-weight:700;font-size:12px;box-shadow:inset 0 -3px 0 var(--c2)}

/* tiers */
.tier-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tier-conf{padding:14px;display:flex;flex-direction:column;gap:10px}
.tier-conf h3{margin:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase}
.lane{border-radius:12px;border:1.5px solid var(--line);padding:10px;background:var(--surface);box-shadow:inset 4px 0 0 var(--tc);transition:background .15s}
.lane-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.lane-h b{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;color:var(--tc)}
.lane-h span{font-size:12px;color:var(--muted)}
.lane-h .cnt{margin-left:auto;font-family:var(--num);font-weight:700}
.lane .chips{display:flex;flex-wrap:wrap;gap:6px;min-height:36px}
.lane.t0{--tc:var(--accent)}.lane.t1{--tc:var(--win)}.lane.t2{--tc:var(--gold)}.lane.t3{--tc:var(--muted)}
.armed .lane{cursor:pointer;border-style:dashed}
.armed .lane:hover{background:color-mix(in srgb,var(--tc) 10%,var(--surface))}
.tchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 6px;font-weight:600;font-size:14px}
.tchip .rec{font-family:var(--num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tchip:hover{border-color:var(--ink)}
.tchip.sel{outline:3px solid var(--accent);outline-offset:1px;background:var(--surface)}

/* matchups */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"card side" "matrix side";gap:20px;align-items:start}
.card{grid-area:card}.side{grid-area:side;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);padding:14px}.matrix-wrap{grid-area:matrix;padding:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;max-width:100%}
.toolbar .adj{margin-left:auto}
.note{padding:10px 16px;font-weight:600;font-size:14px;background:var(--surface-2);border-bottom:1px solid var(--line);min-height:41px}
.note .up{color:var(--win)}.note .down{color:var(--lose)}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto auto minmax(0,1fr);grid-template-areas:"la ga gb lb";gap:18px;padding:20px 20px 6px}
.lineup{display:flex;flex-direction:column;gap:8px;min-width:0}
.la{grid-area:la;align-items:flex-end;text-align:right}
.lb{grid-area:lb;align-items:flex-start}
.tname{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.95;font-size:30px;text-wrap:balance}
.tname small{display:block;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;margin-bottom:2px}
.proj{font-family:var(--num);font-size:13px;color:var(--muted);font-weight:600}
.proj b{color:var(--ink)}
.five{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.five li{display:flex;align-items:center;gap:9px;min-width:0}
.la .five li{flex-direction:row-reverse}
.five .pn{font-weight:600;line-height:1.15;min-width:0}
.five .pp{font-family:var(--num);font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;display:block}
.gcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.ga{grid-area:ga}.gb{grid-area:gb}
.pct{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:22px}
.gauge{width:78px;height:250px;border-radius:12px;background:var(--surface-2);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;background:var(--c1);transition:height .2s ease-out;box-shadow:inset 0 5px 0 var(--c2)}
.gauge .ticks{position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 calc(25% - 1px),color-mix(in srgb,var(--ink) 14%,transparent) calc(25% - 1px) 25%);pointer-events:none}
.picks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:12px 20px 4px}
.pk{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 4px 0 var(--c1,var(--line));touch-action:manipulation;min-width:0}
.pk:hover{border-color:var(--ink)}
.pk .pk-t{font-family:var(--display);font-weight:900;font-size:22px;line-height:1}
.pk .pk-s{font-family:var(--num);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.pk.big{background:var(--c1);color:var(--ci);border-color:var(--c1);box-shadow:inset 0 -4px 0 var(--c2)}
.pk.big .pk-s{color:inherit;opacity:.85}
.pk.on{outline:3px solid var(--ink);outline-offset:2px}
.fine{padding:6px 20px 16px}
.series-line{text-align:center;font-family:var(--num);font-weight:600;color:var(--muted);margin:6px 0 2px}
.series-line b{color:var(--ink)}
input[type=range].share{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0;--v:50%}
input[type=range].share::-webkit-slider-runnable-track{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--ca) 0 var(--v),var(--cb) var(--v) 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
input[type=range].share::-moz-range-track{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--ca) 0 var(--v),var(--cb) var(--v) 100%)}
input[type=range].share::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);margin-top:-7px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
input[type=range].share::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);font-family:var(--num);font-weight:600}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.fives-mob{padding:0 14px 12px}
.fives-mob .fm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.fives-mob .fm-grid .five li{flex-direction:row}
.fives-mob h4{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:17px}
.navrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.navrow .mid{font-family:var(--num);font-weight:600;color:var(--muted)}
.matrix-scroll{overflow-x:auto}
table.matrix{border-collapse:separate;border-spacing:3px;margin-top:8px}
.matrix th{font-family:var(--num);font-size:11px;font-weight:700;color:var(--muted);padding:0 4px}
.matrix th.rowh{text-align:right;white-space:nowrap}
.matrix td{width:30px;height:28px;min-width:30px;border-radius:5px;text-align:center;font-family:var(--num);font-size:11px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.matrix td.self{background:transparent;cursor:default}
.matrix td.cur{outline:2px solid var(--ink);outline-offset:1px}
.matrix td.auto{font-weight:500;font-style:italic;color:var(--muted)}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* standings */
.stand{width:100%;border-collapse:collapse}
.stand td,.stand th{padding:6px 8px;text-align:left}
.stand th{font-family:var(--num);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.stand td{border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.stand td.r,.stand th.r{text-align:right}
.stand .seed{font-family:var(--display);font-weight:800;font-size:18px;width:28px;color:var(--muted)}
.stand .tm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.stand tr.cut td{border-bottom:2px solid var(--ink)}
.stand tr.cut2 td{border-bottom:2px dashed var(--muted)}
.stand tr.hl td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.zone{font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.z-po{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.z-pi{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.z-lo{background:var(--surface-2);color:var(--muted)}
.stand-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.stand-grid .panel{padding:14px;overflow-x:auto}
.ew{padding:16px 18px;margin-bottom:20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.ew .side-l,.ew .side-r{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;text-align:center;line-height:1}
.ew .side-l b,.ew .side-r b{display:block;font-size:34px;font-variant-numeric:tabular-nums}
.ew p{margin:6px 0 0;font-size:13px;color:var(--muted);text-align:center}
.method{margin-top:20px;padding:14px 16px;font-size:14px;color:var(--muted)}
.method p{margin:0 0 6px;max-width:80ch}
.method b{color:var(--ink)}

/* bracket */
.champ{display:flex;align-items:center;gap:20px;padding:20px 22px;margin-bottom:20px;flex-wrap:wrap}
.champ .t{font-family:var(--display);font-weight:900;font-size:44px;line-height:.95;text-transform:uppercase}
.champ .k{font-family:var(--num);color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.champ .fin{font-family:var(--num);color:var(--muted);font-weight:600}
.bracket{display:grid;grid-template-columns:minmax(0,1fr) 200px minmax(0,1fr);gap:16px;align-items:stretch}
.confb{padding:14px;min-width:0}
.confb h3,.finals h3{margin:0 0 10px;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase}
.rounds-scroll{overflow-x:auto}
.rounds{display:grid;grid-template-columns:repeat(3,minmax(132px,1fr));gap:8px;min-width:420px}
.confb.west .rounds{direction:rtl}
.confb.west .rounds > *{direction:ltr}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.round .label{text-align:center}
.sbox{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.slot{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:7px 8px;text-align:left;min-height:38px}
.slot + .slot{border-top:1px solid var(--line)}
button.slot:hover{background:var(--surface-2)}
.slot .sd{font-family:var(--num);font-weight:700;font-size:12px;color:var(--muted);width:14px;text-align:right}
.slot .ab{font-weight:700;flex:1;min-width:0}
.slot .sc{font-family:var(--display);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.slot.w{background:color-mix(in srgb,var(--win) 13%,transparent)}
.slot.l{opacity:.55}
.slot.empty{color:var(--muted);font-size:12px;font-family:var(--num);font-weight:600;justify-content:center;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 45%,transparent) 6px 7px)}
.scores{display:flex;gap:4px;padding:5px 6px;background:var(--surface-2);justify-content:center}
.scores button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 6px;font-family:var(--num);font-weight:700;font-size:12px}
.scores button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sbox .meta{padding:4px 8px;font-size:11px;font-family:var(--num);font-weight:600;color:var(--muted);background:var(--surface-2);text-align:center}
.finals{padding:14px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.finals .sbox{text-align:left}
.champ-slot{border:2px dashed var(--gold);border-radius:12px;min-height:64px;justify-content:center;font-weight:700}
.champ-slot.filled{border-style:solid;background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.playin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:20px}
.playin .panel{padding:14px}
.pi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pi-grid .label{display:block;margin-bottom:6px;font-size:11px}
.progress{display:flex;align-items:center;gap:10px;min-width:180px}
.pbar{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}

/* awards */
.aw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.aw-card{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.aw-card h3{margin:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.aw-card h3 small{display:block;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);text-transform:none;margin-top:3px}
.aslots{display:flex;flex-direction:column;gap:6px}
.aslot{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--line);border-radius:10px;padding:6px 8px;min-height:46px;background:var(--surface)}
.aslot.filled{border-style:solid;background:var(--surface-2)}
.aslot .rk{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:15px;color:#1a1a1a}
.rk1{background:#E9B949}.rk2{background:#C3CBD6}.rk3{background:#CD8B5A}
.aslot .who{flex:1;min-width:0;line-height:1.15}
.aslot .who b{display:block;font-weight:700}
.aslot .who span{font-size:12px;color:var(--muted);font-family:var(--num);font-weight:600}
.aslot .ph{flex:1;color:var(--muted);font-size:13px}
.aslot .ib{border:0;background:none;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:6px}
.aslot .ib:hover{background:var(--surface);color:var(--ink)}
.asearch{position:relative}
.asearch input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px 9px 34px}
.asearch svg{position:absolute;left:10px;top:50%;translate:0 -50%;color:var(--muted)}
.cands{display:flex;flex-wrap:wrap;gap:6px}
.cand{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 6px;font-weight:600;font-size:13px;max-width:100%}
.cand:hover{border-color:var(--ink)}
.cand.used{opacity:.45}
.cand .tm{font-family:var(--num);font-size:11px;color:var(--muted)}
.cand.add{border-style:dashed;color:var(--accent)}
.cands-label{font-size:12px;color:var(--muted);font-weight:600}

/* export */
.share-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
.share-box{padding:16px}
.share-box h3{margin:0 0 12px;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase}
.share-box pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.55;background:var(--surface-2);border-radius:10px;padding:16px;max-height:70vh;overflow:auto}
.share-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.scope{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;margin-bottom:16px}
.copied{font-family:var(--num);font-weight:700;color:var(--win);font-size:13px}
.imgbox{width:100%;max-width:100%;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;min-height:200px}
.imgbox img{width:100%;height:auto;display:block}
footer{color:var(--muted);font-size:12px;padding-block:0 30px}

@media (max-width:980px){
  .mgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"card" "side" "matrix"}
  .side{position:static}
  .share-grid{grid-template-columns:minmax(0,1fr)}
  .bracket{grid-template-columns:minmax(0,1fr)}
  .finals{order:3}
  .confb.west .rounds{direction:ltr}
}
@media (max-width:720px){
  .desk-only{display:none!important}
  .mob-only{display:block}
  .brand h1{font-size:24px}
  .brand small{display:none}
  .view-head h2{font-size:32px}
  .view-head .actions{margin-left:0}
  .how{gap:8px;flex-direction:column;align-items:flex-start}
  .tier-grid{grid-template-columns:minmax(0,1fr)}
  .duel{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"ga gb" "la lb";gap:10px 12px;padding:14px 14px 2px}
  .la,.lb{align-items:center;text-align:center}
  .gcol{gap:6px}
  .badge.lg{--s:44px}
  .gauge{height:120px;width:56px}
  .pct{font-size:32px}
  .tname{font-size:20px}
  .picks{padding:10px 10px 2px;gap:6px}
  .pk{padding:10px 2px 8px}
  .pk .pk-t{font-size:19px}
  .pk .pk-s{font-size:11px}
  .fine{padding:6px 14px 12px}
  .stand-grid,.playin{grid-template-columns:minmax(0,1fr)}
  .pi-grid{grid-template-columns:minmax(0,1fr)}
  .ew{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ew .mid{grid-column:1 / -1;order:3}
  .aw-grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const pkey=(a,b)=>a<b?a+'|'+b:b+'|'+a;

const C=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r;};
function seriesP(p){let s=0;for(let k=0;k<4;k++)s+=C(3+k,k)*Math.pow(p,4)*Math.pow(1-p,k);return s;}
function likelyG(q){let best=-1,lg=0;for(let k=0;k<4;k++){const P=C(3+k,k)*Math.pow(q,4)*Math.pow(1-q,k);if(P>best){best=P;lg=k;}}return 4+lg;}

// ---------- bracket (picked by hand) ----------
const FEED_LABEL={pi78:'7/8 game winner',pi910:'9/10 game winner',pi8:'Play-in 8th seed','r1-0':'1/8 winner','r1-1':'4/5 winner','r1-2':'3/6 winner','r1-3':'2/7 winner','r2-0':'Semi winner','r2-1':'Semi winner',cf:'Conf. champion'};
const SERIES_ORDER=[];for(const c of ['E','W'])SERIES_ORDER.push(c+'-pi78',c+'-pi910',c+'-pi8');
for(const c of ['E','W'])SERIES_ORDER.push(c+'-r1-0',c+'-r1-1',c+'-r1-2',c+'-r1-3');
for(const c of ['E','W'])SERIES_ORDER.push(c+'-r2-0',c+'-r2-1');
SERIES_ORDER.push('E-cf','W-cf','finals');
function bracket(){
  const B={seedOf:{}},mk=(id,a,b,kind,fa,fb)=>{const pk=S.bk[id];let w=null,g=null;
    if(a&&b&&pk&&(pk.w===a||pk.w===b)){w=pk.w;g=kind==='series'?(pk.g||4):null;}
    return B[id]={id,a,b,w,l:w?(w===a?b:a):null,g,kind,fa,fb};};
  for(const c of ['E','W']){const s=M.stand[c];
    s.forEach((id,i)=>B.seedOf[id]=i+1);
    const pi78=mk(c+'-pi78',s[6],s[7],'game'),pi910=mk(c+'-pi910',s[8],s[9],'game');
    const pi8=mk(c+'-pi8',pi78.l,pi910.w,'game',null,c+'-pi910');
    const r1=[mk(c+'-r1-0',s[0],pi8.w,'series',null,c+'-pi8'),mk(c+'-r1-1',s[3],s[4],'series'),mk(c+'-r1-2',s[2],s[5],'series'),mk(c+'-r1-3',s[1],pi78.w,'series',null,c+'-pi78')];
    const r2=[mk(c+'-r2-0',r1[0].w,r1[1].w,'series',c+'-r1-0',c+'-r1-1'),mk(c+'-r2-1',r1[2].w,r1[3].w,'series',c+'-r1-2',c+'-r1-3')];
    mk(c+'-cf',r2[0].w,r2[1].w,'series',c+'-r2-0',c+'-r2-1');
    B.seedOf['po-'+c]={};[s[0],s[1],s[2],s[3],s[4],s[5],pi78.w,pi8.w].forEach((id,i)=>{if(id)B.seedOf['po-'+c][id]=i+1;});
  }
  mk('finals',B['E-cf'].w,B['W-cf'].w,'series','E-cf','W-cf');
  B.champ=B.finals.w;
  B.picked=SERIES_ORDER.filter(id=>B[id].w).length;
  return B;
}
function fillBracket(){S.bk={};for(const id of SERIES_ORDER){compute();const g=M.B[id];if(!g.a||!g.b)continue;const p=M.prob(g.a,g.b);
  if(g.kind==='series'){const w=seriesP(p)>=.5?g.a:g.b;S.bk[id]={w,g:likelyG(w===g.a?p:1-p)};}else S.bk[id]={w:p>=.5?g.a:g.b};}compute();}
function pickWinner(id,t){const g=M.B[id];if(!g||!g.a||!g.b||(t!==g.a&&t!==g.b))return false;push();
  const p=M.prob(g.a,g.b);S.bk[id]={w:t,g:g.kind==='series'?(S.bk[id]&&S.bk[id].w===t&&S.bk[id].g?S.bk[id].g:likelyG(t===g.a?p:1-p)):null};save();return true;}

// ---------- drag and drop (mouse drag, or press-and-hold on touch) ----------
const DND={cfg:null,st:null};
(function(){
  const clean=()=>{const st=DND.st;if(!st)return;clearTimeout(st.timer);if(st.raf)cancelAnimationFrame(st.raf);if(st.ghost)st.ghost.remove();st.it.classList.remove('lifted');
    document.querySelectorAll('.can,.over').forEach(e=>e.classList.remove('can','over'));document.body.classList.remove('dragging');DND.st=null;};
  const begin=()=>{const st=DND.st,c=DND.cfg;st.drag=true;const r=st.it.getBoundingClientRect();const g=st.it.cloneNode(true);
    g.classList.add('ghost');g.removeAttribute('id');g.style.width=r.width+'px';g.style.transform=`translate(${st.x-st.ox}px,${st.y-st.oy}px)`;
    document.body.appendChild(g);st.ghost=g;st.it.classList.add('lifted');document.body.classList.add('dragging');
    document.querySelectorAll(c.target).forEach(t=>{if(t!==st.it&&c.canDrop(st.it,t))t.classList.add('can');});
    try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};
  document.addEventListener('pointerdown',e=>{const c=DND.cfg;if(!c||e.button>0)return;if(e.target.closest('[data-nodrag]'))return;
    const it=e.target.closest(c.item);if(!it||!document.getElementById('app').contains(it))return;
    const r=it.getBoundingClientRect();DND.st={it,x:e.clientX,y:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,drag:false,touch:e.pointerType!=='mouse'};
    if(DND.st.touch)DND.st.timer=setTimeout(()=>{if(DND.st&&!DND.st.drag)begin();},250);});
  document.addEventListener('pointermove',e=>{const st=DND.st;if(!st)return;
    if(!st.drag){if(Math.hypot(e.clientX-st.x,e.clientY-st.y)>8){if(st.touch){clean();return;}begin();}else return;}
    st.cx=e.clientX;st.cy=e.clientY;st.ghost.style.transform=`translate(${e.clientX-st.ox}px,${e.clientY-st.oy}px)`;
    const edge=90,hdr=document.querySelector('.top').getBoundingClientRect().bottom;
    st.vy=e.clientY<hdr+edge?-Math.ceil((hdr+edge-e.clientY)/6):e.clientY>innerHeight-edge?Math.ceil((e.clientY-innerHeight+edge)/6):0;
    if(st.vy&&!st.raf){const loop=()=>{const s=DND.st;if(!s||!s.drag||!s.vy){if(s)s.raf=0;return;}window.scrollBy(0,s.vy);hover();s.raf=requestAnimationFrame(loop);};st.raf=requestAnimationFrame(loop);}
    hover();});
  function hover(){const st=DND.st;if(!st||!st.drag)return;const el=document.elementFromPoint(st.cx,st.cy);let t=el&&el.closest(DND.cfg.target);if(t&&!t.classList.contains('can'))t=null;
    if(st.over&&st.over!==t)st.over.classList.remove('over');st.over=t;if(t)t.classList.add('over');}
  document.addEventListener('pointerup',()=>{const st=DND.st;if(!st)return;const c=DND.cfg,it=st.it;
    if(st.drag){const o=st.over;clean();if(o)c.onDrop(it,o);}else{clean();c.onTap&&c.onTap(it);}});
  document.addEventListener('pointercancel',clean);
  document.addEventListener('touchmove',e=>{if(DND.st&&DND.st.drag)e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',e=>{if(DND.st)e.preventDefault();});
  document.addEventListener('click',e=>{const c=DND.cfg;if(!c||e.detail!==0||e.target.closest('[data-nodrag]'))return;const it=e.target.closest(c.item);if(it&&c.onTap){e.preventDefault();c.onTap(it);}});
})();

function cellStyle(v){if(Math.abs(v-50)<.5)return 'background:var(--surface-2)';const t=Math.min(100,Math.round(Math.abs(v-50)*1.7+12));return `background:color-mix(in oklab,var(${v>50?'--win':'--lose'}) ${t}%,var(--surface-2))`;}
function matrixHTML(c,cur){

    <table class="stand"><thead><tr><th></th><th>Team</th><th class="r">W</th><th class="r">L</th><th class="r">vs ${CONF_NAME[c]}</th><th class="r">vs ${c==='E'?'West':'East'}</th><th></th></tr></thead><tbody>
    ${M.stand[c].map((id,i)=>{const r=rec(id),z=i<6?['z-po','Playoffs']:i<10?['z-pi','Play-In']:['z-lo','Lottery'];
      return `<tr class="${i===5?'cut2':''} ${i===9?'cut':''}"><td class="seed">${i+1}</td><td><span class="tm">${badge(id,'sm')}<span>${esc(T[id].city)} <span class="sub">${esc(T[id].name)}</span></span></span></td>
      <td class="r num"><b>${r.w}</b></td><td class="r num">${r.l}</td><td class="r num sub">${M.WC[id].toFixed(1)}</td><td class="r num sub">${M.WX[id].toFixed(1)}</td><td><span class="zone ${z[0]}">${z[1]}</span></td></tr>`}).join('')}</tbody></table></div>`;
  app.innerHTML=`
  <div class="view-head"><h2>Standings</h2><div class="actions">${nextBtn('playoffs','playoffs')}</div></div>
  ${how([['bolt','These records come from your tiers and matchups'],['slide','Drag the slider below if one conference is stronger']])}
  <section class="panel ew" aria-label="East versus West">
    <div class="side-l">East<b id="ewE">${S.ew}%</b></div>
    <div class="mid"><input type="range" class="share" id="ew" min="20" max="80" step="1" value="${S.ew}" aria-label="East win percentage in East versus West games" style="--ca:var(--accent);--cb:var(--ink);--v:${(S.ew-20)/60*100}%">
      <p>How often the East wins East–West games. This shifts all 450 interconference games.</p></div>
    <div class="side-r">West<b id="ewW">${100-S.ew}%</b></div>
  </section>
  <div class="stand-grid" id="sg">${tbl('E')}${tbl('W')}</div>
  <section class="panel method"><p><b>How the records are counted.</b> Every team collects its expected wins from each game on its schedule: games × win %. Each team plays 4 games against division rivals, 3–4 against the rest of its conference and 2 against every team in the other conference. Nothing assumes the teams can be put in a strict order, so circular picks like A beats B, B beats C and C beats A count exactly as you set them.</p>
  <p>East–West games use each team's average edge over its own conference, plus the East–West slider. Seeding follows expected wins. Exact ties go to the team with the better results against the other tied teams, then to preseason rank.</p></section>`;
  const el=document.getElementById('ew');let started=false;
  el.addEventListener('input',()=>{if(!started){push();started=true;}S.ew=+el.value;el.style.setProperty('--v',(S.ew-20)/60*100+'%');document.getElementById('ewE').textContent=S.ew+'%';document.getElementById('ewW').textContent=(100-S.ew)+'%';compute();document.getElementById('sg').innerHTML=tbl('E')+tbl('W');save();});
  el.addEventListener('change',()=>{started=false;});
  bindGo();
}

// ----- 4 playoffs -----
function feedLabel(f){if(!f)return '';if(f==='E-cf')return 'East champion';if(f==='W-cf')return 'West champion';return FEED_LABEL[f.slice(2)]||'Winner';}
function slotHTML(g,side,seedMap){
  const id=side==='a'?g.a:g.b,feed=side==='a'?g.fa:g.fb;
  if(!id){const ph=feed?feedLabel(feed):(g.id.endsWith('pi8')&&side==='a'?'7/8 game loser':'TBD');
    return `<div class="slot empty" data-sid="${g.id}" ${feed?`data-feed="${feed}"`:''}>${esc(ph)}</div>`;}
  const cls=g.w?(g.w===id?'w':'l'):'';const sc=g.w?(g.kind==='series'?(g.w===id?4:g.g-4):(g.w===id?'W':'')):'';
  return `<button class="slot ${cls}" data-drag data-id="${id}" data-sid="${g.id}" ${feed?`data-feed="${feed}"`:''} aria-label="${esc(T[id].name)}${g.w===id?', winner':''}. Tap to pick as winner">
    <span class="grip">${ICON.grip}</span><span class="sd">${seedMap[id]??''}</span>${badge(id,'xs')}<span class="ab">${id}</span><span class="sc">${sc}</span></button>`;
}
function sboxHTML(g,seedMap){
  let foot='';
  if(g.w&&g.kind==='series')foot=`<div class="scores" role="group" aria-label="Series result">${[0,1,2,3].map(k=>`<button data-nodrag data-score="${g.id}" data-g="${4+k}" class="${g.g===4+k?'on':''}" aria-pressed="${g.g===4+k}">4-${k}</button>`).join('')}</div>`;
  else if(g.a&&g.b&&!g.w){const p=M.prob(g.a,g.b),pa=g.kind==='series'?seriesP(p):p,fav=pa>=.5?g.a:g.b;foot=`<div class="meta">Tap the winner · season odds ${fav} ${Math.round(Math.max(pa,1-pa)*100)}%</div>`;}
  return `<div class="sbox">${slotHTML(g,'a',seedMap)}${slotHTML(g,'b',seedMap)}${foot}</div>`;
}
function confBracket(c){const B=M.B,sm=B.seedOf['po-'+c];
  return `<section class="panel confb ${c==='W'?'west':''}"><h3>${CONF_NAME[c]}</h3><div class="rounds-scroll"><div class="rounds">
    <div class="round"><div class="label">First round</div>${[0,1,2,3].map(k=>sboxHTML(B[`${c}-r1-${k}`],sm)).join('')}</div>
    <div class="round"><div class="label">Semifinals</div>${[0,1].map(k=>sboxHTML(B[`${c}-r2-${k}`],sm)).join('')}</div>
    <div class="round"><div class="label">Conf. finals</div>${sboxHTML(B[`${c}-cf`],sm)}</div></div></div></section>`;}
function renderPlayoffs(){
  const B=M.B,F=B.finals,ch=B.champ,total=SERIES_ORDER.length;
  const fsm={};['E','W'].forEach(c=>Object.assign(fsm,B.seedOf['po-'+c]));
  const pi=c=>`<section class="panel"><div class="label" style="margin-bottom:10px">${CONF_NAME[c]} play-in</div><div class="pi-grid">
     <div><span class="label">7 vs 8 · winner is No. 7</span>${sboxHTML(B[c+'-pi78'],B.seedOf)}</div>
     <div><span class="label">9 vs 10 · loser is out</span>${sboxHTML(B[c+'-pi910'],B.seedOf)}</div>
     <div><span class="label">For No. 8</span>${sboxHTML(B[c+'-pi8'],B.seedOf)}</div></div></section>`;
  app.innerHTML=`
  <div class="view-head"><h2>Playoffs</h2>
    <div class="progress"><div class="pbar"><i style="width:${B.picked/total*100}%"></i></div><span class="sub num">${B.picked} of ${total} picked</span></div>
    <div class="actions"><button class="btn primary" id="fill">Fill from my season predictions</button><button class="btn warn" id="clearbk">Clear bracket</button>${nextBtn('awards','awards')}</div></div>
  ${how([['tap','Tap the team that wins each game or series'],['grip','Or drag a team into the next round'],['tap','Then set the series score, 4-0 to 4-3']])}
  <div class="status ${lastNote?'on':''}" id="pnote" aria-live="polite">${lastNote||(B.picked?'Seeds come from your standings. Change a pick any time; later rounds follow.':'Seeds come from your standings. Start with the play-in, or fill the whole bracket from your season predictions and adjust.')}</div>
  ${ch?`<section class="panel champ" aria-label="Champion">${badge(ch,'xl')}<div><div class="k">2027 NBA Champions</div><div class="t">${esc(full(ch))}</div>
    <div class="fin num">Finals: ${F.w} def. ${F.l} 4-${F.g-4} · ${rec(ch).s} regular season</div></div></section>`:''}
  <div class="playin">${pi('E')}${pi('W')}</div>
  <div class="bracket">${confBracket('E')}
    <section class="panel finals"><h3>NBA Finals</h3>${sboxHTML(F,fsm)}
      <div class="slot champ-slot ${ch?'filled':''}" data-feed="finals" data-sid="champ">${ch?`${badge(ch,'sm')} ${esc(T[ch].name)} win it all`:'Drop the champion here'}</div></section>
    ${confBracket('W')}</div>`;
  const nameOf=id=>T[id].name;
  const after=(id,t)=>{const g=M.B[id];compute();const ng=M.B[id];
    if(id==='finals')return `${nameOf(t)} win the title!`;
    if(id.endsWith('pi78'))return `${nameOf(t)} take the 7th seed. ${nameOf(g.a===t?g.b:g.a)} get one more chance.`;
    if(id.endsWith('pi910'))return `${nameOf(t)} move on to the last play-in game.`;
    if(id.endsWith('pi8'))return `${nameOf(t)} take the 8th seed.`;
    return `${nameOf(t)} win ${ng.g?'4-'+(ng.g-4):''} and move on.`;};
  const choose=(sid,t)=>{const g=M.B[sid];if(!g.a||!g.b){lastNote='Pick the earlier game first.';renderPlayoffs();return;}
    if(g.w===t){push();delete S.bk[sid];save();lastNote=`Pick removed.`;compute();renderPlayoffs();return;}
    if(pickWinner(sid,t)){lastNote=after(sid,t);compute();renderPlayoffs();}};
  DND.cfg={item:'button.slot[data-id]',target:'.slot[data-feed]',
    canDrop:(it,t)=>{const f=M.B[t.dataset.feed];return !!f&&!!f.a&&!!f.b&&(f.a===it.dataset.id||f.b===it.dataset.id)&&t.dataset.sid!==it.dataset.sid;},
    onDrop:(it,t)=>{const f=t.dataset.feed,id=it.dataset.id;if(M.B[f].w!==id&&pickWinner(f,id)){lastNote=after(f,id);compute();renderPlayoffs();}},
    onTap:it=>choose(it.dataset.sid,it.dataset.id)};
  app.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{push();S.bk[b.dataset.score].g=+b.dataset.g;save();lastNote='';compute();renderPlayoffs();});
  document.getElementById('fill').onclick=e=>{const go=()=>{push();fillBracket();lastNote='Filled from your season predictions. Change any pick you like.';save();renderPlayoffs();};
    if(M.B.picked)arm(e.target,'Replace your picks? Click again',go);else go();};
  document.getElementById('clearbk').onclick=e=>arm(e.target,'Clear bracket? Click again',()=>{push();S.bk={};lastNote='';save();compute();renderPlayoffs();});
  bindGo();
}

// ----- 5 awards -----
const AQ={};
function candidates(aw,q){
  const def=AWARDS.find(a=>a[0]===aw);q=fold(q.trim());
  if(!q)return def[3];
  const words=q.split(/\s+/);const out=[];
  for(const [k,p] of Object.entries(PLAYERS)){if(!words.every(w=>p.f.includes(w)))continue;
    const n=fold(p.name);const score=(n.startsWith(q)?0:n.split(' ').some(x=>x.startsWith(words[0]))?1:2)+(p.pos==='Bench'?.5:0);out.push([score,k]);}
  return out.sort((a,b)=>a[0]-b[0]||PLAYERS[a[1]].name.localeCompare(PLAYERS[b[1]].name)).slice(0,10).map(x=>x[1]);
}
function candsHTML(aw){
  const q=AQ[aw]||'',list=candidates(aw,q),L=S.aw[aw];
  let h=`<span class="cands-label">${q?'Matches':'Popular picks'}</span><div class="cands">`;
  h+=list.map(k=>{const p=PLAYERS[k],used=L.indexOf(k);return `<button class="cand ${used>=0?'used':''}" data-drag data-id="${k}" data-award="${aw}" title="${esc(p.name)}, ${p.team}"><span class="grip">${ICON.grip}</span>${badge(p.team,'xs')}${esc(p.name)}<span class="tm">${used>=0?'#'+(used+1):p.team}</span></button>`;}).join('');
  const qt=q.trim(),multi=qt.split(/\s+/).length>1;
  if(qt&&(!list.length||(multi&&!list.some(k=>fold(PLAYERS[k].name)===fold(qt)))))h+=`<button class="cand add" data-add="${aw}">+ Add “${esc(q.trim())}”</button>`;
  if(q.trim()&&!list.length)h+=`<span class="cands-label">No player found in the starting fives or key bench players.</span>`;
  return h+'</div>';
}
function awardCard([aw,short,long]){
  const L=S.aw[aw];
  return `<section class="panel aw-card" data-card="${aw}"><h3>${short}<small>${long}</small></h3>
   <div class="aslots">${[0,1,2].map(r=>{const k=L[r];const p=player(k);
     return p?`<div class="aslot filled" data-drag data-id="${esc(k)}" data-award="${aw}" data-rank="${r}"><span class="rk rk${r+1}">${r+1}</span><span class="grip">${ICON.grip}</span>${badge(p.team,'sm')}<span class="who"><b>${esc(p.name)}</b><span>${p.team?full(p.team):'Custom pick'}${p.pos?' · '+p.pos:''}</span></span>
       ${r>0?`<button class="ib" data-nodrag data-up="${aw}:${r}" aria-label="Move up">↑</button>`:''}<button class="ib" data-nodrag data-rm="${aw}:${r}" aria-label="Remove">✕</button></div>`
       :`<div class="aslot" data-award="${aw}" data-rank="${r}"><span class="rk rk${r+1}">${r+1}</span><span class="ph">Drag a player here, or tap one below</span></div>`;}).join('')}</div>
   <label class="asearch"><span class="sr" hidden>Search players for ${short}</span>${ICON.search}<input type="search" placeholder="Search a player or team…" data-q="${aw}" value="${esc(AQ[aw]||'')}" autocomplete="off" aria-label="Search players for ${short}"></label>
   <div id="cands-${aw}">${candsHTML(aw)}</div></section>`;
}
let awNote='';
function addAward(aw,k){const L=S.aw[aw];const i=L.indexOf(k);const name=player(k).name;
  if(i>=0){awNote=`${name} is already #${i+1}.`;return false;}
  const e=L.indexOf(null);if(e<0){awNote='Top 3 is full. Drag onto a spot to replace someone, or remove one.';return false;}
  push();L[e]=k;awNote=`${name} added at #${e+1}.`;save();return true;}
function renderAwards(){
  const done=AWARDS.reduce((s,a)=>s+S.aw[a[0]].filter(Boolean).length,0);
  app.innerHTML=`<div class="view-head"><h2>Awards</h2><span class="sub">${done} of 15 spots filled</span><div class="actions"><button class="btn warn" id="clearaw">Clear awards</button>${nextBtn('export','export')}</div></div>
   ${how([['search','Search any player or team'],['grip','Drag a player onto 1st, 2nd or 3rd'],['tap','Or tap a player to fill the next open spot']])}
   <div class="status ${awNote?'on':''}" id="awnote" aria-live="polite">${awNote||'Drag filled spots to reorder them. Not in the list? Type the name and add it.'}</div>
   <div class="aw-grid">${AWARDS.map(awardCard).join('')}</div>`;
  awNote='';
  DND.cfg={item:'.cand[data-id], .aslot.filled',target:'.aslot',
    canDrop:(it,t)=>it.dataset.award===t.dataset.award&&it!==t,
    onDrop:(it,t)=>{const aw=t.dataset.award,r=+t.dataset.rank,k=it.dataset.id,L=S.aw[aw];push();
      const from=it.dataset.rank!=null?+it.dataset.rank:L.indexOf(k);
      if(from>=0){[L[from],L[r]]=[L[r],L[from]];}
      else{const n=[...L];n.splice(r,0,k);const gap=n.indexOf(null,r+1);if(gap>=0)n.splice(gap,1);S.aw[aw]=n.slice(0,3);}
      awNote=`${player(k).name} is now #${r+1}.`;save();renderAwards();},
    onTap:it=>{if(it.classList.contains('cand')){addAward(it.dataset.award,it.dataset.id);renderAwards();refocus(it.dataset.award);}}};
  app.querySelectorAll('[data-q]').forEach(inp=>inp.addEventListener('input',()=>{AQ[inp.dataset.q]=inp.value;document.getElementById('cands-'+inp.dataset.q).innerHTML=candsHTML(inp.dataset.q);}));
  document.getElementById('clearaw').onclick=e=>arm(e.target,'Clear all awards? Click again',()=>{push();S.aw=emptyAw();save();renderAwards();});
  bindGo();
}
function refocus(aw){const i=app.querySelector(`[data-q="${aw}"]`);if(i&&AQ[aw]&&matchMedia('(pointer:fine)').matches)i.focus();}
function awClicks(e){if(S.view!=='awards')return;
  const rm=e.target.closest('[data-rm]'),up=e.target.closest('[data-up]'),add=e.target.closest('[data-add]');
  if(rm){const [aw,r]=rm.dataset.rm.split(':');push();S.aw[aw][+r]=null;const L=S.aw[aw];S.aw[aw]=[...L.filter(Boolean),null,null,null].slice(0,3);save();renderAwards();}
  else if(up){const [aw,r]=up.dataset.up.split(':');const L=S.aw[aw],i=+r;push();[L[i-1],L[i]]=[L[i],L[i-1]];save();renderAwards();}
  else if(add){const aw=add.dataset.add,name=(AQ[aw]||'').trim();if(name){if(addAward(aw,'x:'+name))AQ[aw]='';renderAwards();}}
}

// ----- 6 export: text -----
const serTxt=g=>g.w?`${g.w} d. ${g.l}${g.kind==='series'?' 4-'+(g.g-4):''}`:`${g.a||'TBD'} vs ${g.b||'TBD'}: not picked`;
function matchesText(mode){
  const B=M.B,isFull=mode==='full',L=[];
  for(const c of ['E','W']){
    L.push(c==='E'?'🔵 EAST':'🔴 WEST');const s=M.stand[c];
    s.slice(0,isFull?10:6).forEach((id,i)=>L.push(`${i+1}. ${full(id)} ${rec(id).s}${i>=6?' (play-in)':''}`));
    if(isFull)L.push(`Lottery: ${s.slice(10).join(', ')}`);
    L.push('');
  }
  L.push('🏆 PLAYOFFS');
  if(!B.picked){L.push('Bracket not picked yet.');return L;}
  for(const c of ['E','W']){
    const s7=B[c+'-pi78'].w,s8=B[c+'-pi8'].w;
    if(isFull){
      L.push(`${CONF_NAME[c]} play-in → 7: ${s7||'TBD'}, 8: ${s8||'TBD'}`);
      L.push(`${CONF_NAME[c]} R1: ${[0,1,2,3].map(k=>serTxt(B[`${c}-r1-${k}`])).join(' · ')}`);
      L.push(`${CONF_NAME[c]} semis: ${[0,1].map(k=>serTxt(B[`${c}-r2-${k}`])).join(' · ')}`);
      L.push(`${CONF_NAME[c]} finals: ${serTxt(B[c+'-cf'])}`);
    }else L.push(`${CONF_NAME[c]} champ: ${B[c+'-cf'].w?`${T[B[c+'-cf'].w].name} (${serTxt(B[c+'-cf'])})`:'TBD'}`);
  }
  L.push(`Finals: ${serTxt(B.finals)}`);
  if(B.champ)L.push('',`👑 CHAMPION: ${full(B.champ)}`);
  return L;
}
function awardsText(){
  const L=['🏅 AWARDS'];let any=false;
  for(const [aw,short] of AWARDS){const picks=S.aw[aw].map((k,i)=>k?`${i+1}. ${player(k).name}${player(k).team?' ('+player(k).team+')':''}`:null).filter(Boolean);
    if(picks.length){any=true;L.push(`${short}: ${picks.join(' · ')}`);}}
  if(!any)L.push('No awards picked yet.');
  return L;
}
function exportText(){
  const L=['🏀 My 2026-27 NBA predictions',''];
  if(S.scope!=='awards')L.push(...matchesText(S.share));
  if(S.scope==='both')L.push('');
  if(S.scope!=='matches')L.push(...awardsText());
  return L.join('\n');
}

// ----- 6 export: image -----
const CD='"Big Shoulders Display","Arial Narrow",Impact,sans-serif',CB='"Barlow",system-ui,sans-serif',CN='"Barlow Semi Condensed","Barlow",system-ui,sans-serif';
const IMG={BG:'#0E1422',CARD:'#161E30',FG:'#EEF2F8',MU:'#8E9BB2',LINE:'#2A3550',ACC:'#F27A3E',GOLD:'#E9B949'};
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function cBadge(x,id,cx,cy,r){x.save();x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);
  if(!id){x.fillStyle='#2A3550';x.fill();x.restore();return;}
  const t=T[id];x.fillStyle=t.c1;x.fill();const lw=Math.max(2,r*.14);x.beginPath();x.arc(cx,cy,r-lw/2,0,Math.PI*2);x.lineWidth=lw;x.strokeStyle=t.c2;x.stroke();
  x.fillStyle=t.ci;x.font=`900 ${Math.round(r*.72)}px ${CD}`;x.textAlign='center';x.textBaseline='middle';x.fillText(id,cx,cy+r*.04);x.restore();}
function fitFont(x,text,maxW,size,weight,fam){let s=size;do{x.font=`${weight} ${s}px ${fam}`;s-=2;}while(x.measureText(text).width>maxW&&s>12);}
function drawMatches(x,oy){
  const {FG,MU,LINE,ACC,GOLD,CARD}=IMG,B=M.B,ch=B.champ;
  if(ch){const t=T[ch],F=B.finals;rr(x,60,oy+15,960,170,24);x.fillStyle=t.c1;x.fill();x.lineWidth=4;x.strokeStyle=t.c2;x.stroke();
    cBadge(x,ch,160,oy+100,64);x.fillStyle=t.ci;x.globalAlpha=.8;x.font=`700 22px ${CN}`;x.fillText('2027 NBA CHAMPION',258,oy+64);x.globalAlpha=1;
    const nm=full(ch).toUpperCase();fitFont(x,nm,730,66,900,CD);x.fillText(nm,256,oy+126);
    x.font=`600 25px ${CB}`;x.fillText(`Finals: ${F.w} def. ${F.l} 4-${F.g-4}   ·   ${rec(ch).s} regular season`,258,oy+164);}
  else{rr(x,60,oy+15,960,170,24);x.fillStyle=CARD;x.fill();x.fillStyle=MU;x.font=`800 40px ${CD}`;x.fillText('CHAMPION NOT PICKED YET',100,oy+95);
    x.font=`600 24px ${CB}`;x.fillText(`${B.picked} of ${SERIES_ORDER.length} playoff picks made`,100,oy+138);}
  const col=(c,X)=>{let y=oy+248;x.fillStyle=FG;x.font=`900 36px ${CD}`;x.fillText(c==='E'?'EAST':'WEST',X,y);
    x.fillStyle=MU;x.font=`700 16px ${CN}`;x.textAlign='right';x.fillText('W-L',X+460,y);x.textAlign='left';
    const top0=oy+264,rh=34;
    M.stand[c].forEach((id,i)=>{const top=top0+i*rh,cy=top+rh/2;
      if(i===6||i===10){x.strokeStyle=i===10?'#56637F':LINE;x.lineWidth=2;x.setLineDash(i===6?[6,6]:[]);x.beginPath();x.moveTo(X,top);x.lineTo(X+460,top);x.stroke();x.setLineDash([]);}
      x.fillStyle=i<6?FG:i<10?GOLD:MU;x.font=`800 22px ${CD}`;x.textAlign='right';x.fillText(String(i+1),X+26,cy+8);x.textAlign='left';
      cBadge(x,id,X+52,cy,13);x.fillStyle=i<10?FG:MU;const n=full(id);fitFont(x,n,300,21,600,CB);x.fillText(n,X+74,cy+7);
      x.font=`700 21px ${CN}`;x.textAlign='right';x.fillText(rec(id).s,X+460,cy+7);x.textAlign='left';});};
  col('E',60);col('W',560);
  x.strokeStyle=LINE;x.lineWidth=2;x.beginPath();x.moveTo(60,oy+792);x.lineTo(1020,oy+792);x.stroke();
  const br=(c,X)=>{let y=oy+832;
    const sec=(label,games)=>{x.fillStyle=MU;x.font=`700 16px ${CN}`;x.fillText(label,X,y);y+=6;
      games.forEach(g=>{y+=30;cBadge(x,g.w,X+12,y-8,11);x.fillStyle=g.w?FG:MU;x.font=`600 21px ${CB}`;
        x.fillText(g.w?`${g.w} d. ${g.l}`:`${g.a||'TBD'} vs ${g.b||'TBD'}`,X+32,y);
        x.font=`700 21px ${CN}`;x.textAlign='right';x.fillText(g.w?`4-${g.g-4}`:'—',X+460,y);x.textAlign='left';});y+=30;};
    sec(`${CONF_NAME[c].toUpperCase()} · FIRST ROUND`,[0,1,2,3].map(k=>B[`${c}-r1-${k}`]));sec('SEMIFINALS',[0,1].map(k=>B[`${c}-r2-${k}`]));sec('CONFERENCE FINALS',[B[c+'-cf']]);};
  br('E',60);br('W',560);
  x.fillStyle=MU;x.font=`600 18px ${CB}`;const pw=c=>`${B[c+'-pi78'].w||'TBD'}, ${B[c+'-pi8'].w||'TBD'}`;
  x.fillText(`Play-in winners · East: ${pw('E')}  ·  West: ${pw('W')}`,60,oy+1168);
}
const AW_CARD_H=226;
function drawAwards(x,oy,cols){
  const {FG,MU,CARD}=IMG;x.fillStyle=FG;x.font=`900 36px ${CD}`;x.fillText('AWARDS',60,oy+40);
  const cw=cols===2?470:960,gap=20;const medal=['#E9B949','#C3CBD6','#CD8B5A'];
  AWARDS.forEach(([aw,short,long],i)=>{const cx=60+(cols===2?(i%2)*(cw+gap):0),cy=oy+66+Math.floor(cols===2?i/2:i)*(AW_CARD_H+gap);
    rr(x,cx,cy,cw,AW_CARD_H,18);x.fillStyle=CARD;x.fill();
    x.fillStyle=FG;x.font=`900 28px ${CD}`;x.fillText(short.toUpperCase(),cx+20,cy+40);
    x.fillStyle=MU;x.font=`600 16px ${CB}`;x.fillText(long,cx+20,cy+64);
    S.aw[aw].forEach((k,r)=>{const y=cy+104+r*42,p=player(k);
      x.beginPath();x.arc(cx+34,y,15,0,Math.PI*2);x.fillStyle=medal[r];x.fill();
      x.fillStyle='#1a1a1a';x.font=`900 18px ${CD}`;x.textAlign='center';x.textBaseline='middle';x.fillText(String(r+1),cx+34,y+1);x.textAlign='left';x.textBaseline='alphabetic';
      if(p){if(p.team)cBadge(x,p.team,cx+70,y,13);x.fillStyle=FG;fitFont(x,p.name,cw-170,23,600,CB);x.fillText(p.name,cx+(p.team?92:58),y+8);
        if(p.team){x.fillStyle=MU;x.font=`700 18px ${CN}`;x.textAlign='right';x.fillText(p.team,cx+cw-20,y+7);x.textAlign='left';}}
      else{x.fillStyle=MU;x.font=`600 21px ${CB}`;x.fillText('—',cx+58,y+8);}});});
  const rows=cols===2?3:5;return 66+rows*AW_CARD_H+(rows-1)*gap;
}
function drawExport(){
  const scope=S.scope,cols=scope==='both'?2:1;
  const awH=66+(cols===2?3:5)*AW_CARD_H+(cols===2?2:4)*20;
  const Hh=150+(scope!=='awards'?1190:0)+(scope==='both'?20:0)+(scope!=='matches'?awH+20:0)+50;
  const W=1080,cv=document.createElement('canvas');cv.width=W;cv.height=Hh;const x=cv.getContext('2d');const {BG,FG,ACC}=IMG;
  x.fillStyle=BG;x.fillRect(0,0,W,Hh);
  x.strokeStyle='rgba(255,255,255,.045)';x.lineWidth=6;[[W-80,80,240],[W-80,80,90]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.stroke();});
  x.textBaseline='alphabetic';x.textAlign='left';
  x.fillStyle=FG;fitFont(x,'MY 2026–27 NBA PREDICTIONS',900,66,900,CD);x.fillText('MY 2026–27 NBA PREDICTIONS',60,100);
  x.fillStyle=ACC;x.font=`700 22px ${CN}`;x.fillText(scope==='awards'?'SEASON AWARDS':scope==='matches'?'REGULAR SEASON  ·  PLAY-IN  ·  PLAYOFFS':'STANDINGS  ·  PLAYOFFS  ·  AWARDS',62,136);
  let y=150;if(scope!=='awards'){drawMatches(x,y);y+=1190;}if(scope==='both')y+=20;if(scope!=='matches'){drawAwards(x,y,cols);}
  x.textAlign='right';x.fillStyle=ACC;x.font=`800 20px ${CD}`;x.fillText('NBA PREDICTION',1020,Hh-24);x.textAlign='left';
  return cv;
}
async function makeImage(){try{await Promise.all([document.fonts.load(`900 60px ${CD}`),document.fonts.load(`600 21px ${CB}`),document.fonts.load(`700 21px ${CN}`)]);}catch(e){}return drawExport();}
const framed=(()=>{try{return window.self!==window.top}catch(e){return true}})();
let shareCanvas=null;
function renderExport(){
  const txt=exportText();
  app.innerHTML=`
  <div class="view-head"><h2>Export</h2></div>
  ${how([['tap','Choose what to include'],['tap','Copy the text for group chats, or the image for social posts']])}
  <section class="panel scope"><span class="label">Include</span>
    <div class="seg" role="group" aria-label="What to include"><button aria-pressed="${S.scope==='matches'}" data-scope="matches">Matches</button><button aria-pressed="${S.scope==='awards'}" data-scope="awards">Awards</button><button aria-pressed="${S.scope==='both'}" data-scope="both">Both</button></div>
    <span class="sub">${S.scope==='awards'?'Your award top 3s':S.scope==='matches'?'Standings and the playoff bracket':'Standings, bracket and award top 3s'}</span></section>
  <div class="share-grid">
    <section class="panel share-box"><h3>Text</h3>
      <div class="share-row">${S.scope!=='awards'?`<div class="seg" role="group" aria-label="Summary length"><button aria-pressed="${S.share==='full'}" data-m="full">Full</button><button aria-pressed="${S.share==='short'}" data-m="short">Short</button></div>`:''}
        <button class="btn primary" id="copy">Copy text</button><span class="copied" id="copied" aria-live="polite"></span></div>
      <pre id="sumtxt" tabindex="0">${esc(txt)}</pre>
    </section>
    <section class="panel share-box"><h3>Image</h3>
      <div class="share-row"><button class="btn primary" id="copyImg">Copy image</button>
        ${framed?'':'<button class="btn" id="dlImg">Download PNG</button>'}
        <button class="btn" id="shImg" hidden>Share…</button><span class="copied" id="imgMsg" aria-live="polite"></span></div>
      <div class="imgbox"><img id="shareImg" alt="Image of your predictions" hidden><span class="sub" id="imgWait">Drawing your image…</span></div>
      <p class="sub" style="margin:10px 0 0">On a phone, press and hold the image to save or share it. On a computer, right-click it.</p>
    </section>
  </div>`;
  app.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.scope;save();renderExport();});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.share=b.dataset.m;save();renderExport();});
  document.getElementById('copy').onclick=()=>{const out=document.getElementById('copied');
    const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('sumtxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);out.textContent='Selected. Press Ctrl/Cmd+C';};
    try{navigator.clipboard.writeText(txt).then(()=>out.textContent='Copied ✓',sel);}catch(e){sel();}};
  const msg=t=>{const m=document.getElementById('imgMsg');if(m)m.textContent=t;};
  shareCanvas=null;const scopeAt=S.scope;
  makeImage().then(cv=>{if(S.view!=='export'||S.scope!==scopeAt)return;shareCanvas=cv;const url=cv.toDataURL('image/png');const img=document.getElementById('shareImg');
    img.src=url;img.hidden=false;document.getElementById('imgWait').hidden=true;
    const name=`nba-predictions-2026-27-${S.scope}.png`;
    if(!framed)cv.toBlob(bl=>{if(!bl)return;const file=new File([bl],name,{type:'image/png'});
      try{if(navigator.canShare&&navigator.canShare({files:[file]})){const b=document.getElementById('shImg');if(!b)return;b.hidden=false;
        b.onclick=()=>navigator.share({files:[file],title:'My 2026-27 NBA predictions'}).catch(()=>{});}}catch(e){}},'image/png');
    const dl=document.getElementById('dlImg');if(dl)dl.onclick=()=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();};
  });
  document.getElementById('copyImg').onclick=()=>{
    if(!shareCanvas){msg('Still drawing, try again in a second');return;}
    const fail=()=>msg('Copying images is blocked here. Press and hold or right-click the image instead.');
    try{const blob=new Promise(res=>shareCanvas.toBlob(res,'image/png'));navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(()=>msg('Image copied ✓'),fail);}catch(e){fail();}
  };
}

// boot
app.addEventListener('click',awClicks);
const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h;
render();
</script>
